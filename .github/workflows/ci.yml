name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (incl. dependency boundaries)
        run: pnpm run lint

      # Before typecheck and the tests: units resolve each other through dist/, so both read
      # declarations that only exist once the workspace has been built.
      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Root suites (boundary, purity and type-safety rules fire)
        run: pnpm run test:root

      - name: Formatting
        run: pnpm run format:check

      # Last, and only once everything above is green: a browser is the slowest thing in the run.
      - name: Chromium for the E2E suite
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (two browsers in one forced round; a stranger's round, broken and verified)
        run: pnpm run e2e

      - name: E2E traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7
